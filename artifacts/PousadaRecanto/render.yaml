services:
  - type: web
    name: pousada-recanto-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: pousada_recanto
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: POUSADA_PUBLICA_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

  - type: web
    name: pousada-recanto-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: VITE_AIRBNB_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
